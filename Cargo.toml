[package]
name = "dprint-plugin-tailwindcss"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Sorts Tailwind CSS classes for dprint."
homepage = "https://github.com/colinaaa/dprint-plugin-tailwindcss"
repository = "https://github.com/colinaaa/dprint-plugin-tailwindcss"

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]

[dependencies]
anyhow = "1.0"
dprint-core = { version = "0.69.1", features = ["wasm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
regex = "1.0"
once_cell = "1.0"

[dev-dependencies]
dprint-development = "0.11.0"
serde_json = "1.0"
